<style>
    /* Professional Loader - Matching UI Theme */
    #loader {
        width: 100%;
        height: 100%;
        position: fixed;
        z-index: 999999;
/* FROM */

/* TO */
background: #0D1B2A;
        top: 0;
        right: 0;
        left: 0;
        bottom: 0;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    
    #loader.active {
        display: flex;
        opacity: 1;
    }
    
    /* Spinner Animation */
    .loader-spinner {
        width: 80px;
        height: 80px;
        border: 6px solid rgba(255, 255, 255, 0.2);
        border-top: 6px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 25px;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    /* Logo/Icon */
    .loader-icon {
        width: 60px;
        height: 60px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        color: #667eea;
        margin-bottom: 30px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        50% {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
    }
    
    /* Loading Text */
    .loader-text {
        color: white;
        font-size: 18px;
        font-weight: 600;
        margin-top: 20px;
        letter-spacing: 1px;
    }
    
    /* Dots Animation */
    .loader-dots {
        display: inline-block;
    }
    
    .loader-dots::after {
        content: '';
        animation: dots 1.5s steps(4, end) infinite;
    }
    
    @keyframes dots {
        0%, 20% { content: ''; }
        40% { content: '.'; }
        60% { content: '..'; }
        80%, 100% { content: '...'; }
    }
</style>

<!-- Professional Loader -->
<div id="loader">
    <div class="loader-icon">
        <i class="fas fa-graduation-cap"></i>
    </div>
    <div class="loader-spinner"></div>
    <div class="loader-text">
        Loading<span class="loader-dots"></span>
    </div>
</div>

<script>
// FIXED: Proper loader handling - no stuck on back button
(function() {
    const loader = document.getElementById('loader');
    let isNavigating = false;
    
    // Show loader on page unload (navigation away)
    window.addEventListener('beforeunload', function(e) {
        // Only show loader if actually navigating (not just refreshing)
        if (!e.defaultPrevented) {
            isNavigating = true;
            loader.classList.add('active');
        }
    });
    
    // Hide loader when page is shown (back button or page load)
    window.addEventListener('pageshow', function(event) {
        // Hide loader immediately when page is restored from cache
        loader.classList.remove('active');
        isNavigating = false;
    });
    
    // Hide loader when page fully loads
    window.addEventListener('load', function() {
        loader.classList.remove('active');
        isNavigating = false;
    });
    
    // Backup: Hide loader after DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
        // Small delay to ensure smooth transition
        setTimeout(function() {
            loader.classList.remove('active');
        }, 100);
    });
    
// Show loader on link clicks (optional - for internal navigation)
document.addEventListener('click', function(e) {
    const link = e.target.closest('a');
    if (link && link.href && !link.target && link.href.indexOf('#') === -1) {
        // Check if it's an external link
        if (link.href.indexOf(window.location.origin) === -1) {
            return; // Don't show loader for external links
        }

        const href = link.href.toLowerCase();
        const isDownload = link.download || 
            ['download', 'excel', 'pdf', 'export'].some(kw => href.includes(kw));

        if (isDownload) {
            // Show loader for downloads, but auto-hide after delay
            loader.classList.add('active');
            setTimeout(function() {
                loader.classList.remove('active');
            }, 8000); // 8 seconds — enough time for Excel to generate
            return;
        }

        loader.classList.add('active');
    }
});
    
    // Show loader on form submissions
    document.addEventListener('submit', function(e) {
        loader.classList.add('active');
    });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  // Disable Right Click
  window.addEventListener('contextmenu', function(event) {
    event.preventDefault();
    Swal.fire({
      icon: 'warning',
      title: 'Action Blocked!',
      text: 'Right Click is Disabled 🚫',
      confirmButtonColor: '#d33'
    });
  });

  // Disable F12, Ctrl+U, Ctrl+Shift+I, Ctrl+Shift+C
  window.addEventListener('keydown', function(event) {
    // Block F12
    if (event.key === 'F12') {
      event.preventDefault();

    }

    // Block Ctrl+U
    if (event.ctrlKey && event.key.toLowerCase() === 'u') {
      event.preventDefault();

    }

    // Block Ctrl+Shift+I (Inspect)
    if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 'i') {
      event.preventDefault();

    }

    // Block Ctrl+Shift+C (Element Inspector)
    if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 'c') {
      event.preventDefault();

    }
  });
</script>
