<!-- ===== HEADER STYLES ===== -->
<style>
/* ---- TOPBAR ---- */
.cca-topbar {
    background: #0A1628;
    color: rgba(255,255,255,0.75);
    font-size: 0.78rem;
    padding: 7px 0;
    letter-spacing: 0.3px;
}
.cca-topbar-left span,
.cca-topbar-right a {
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    font-size: 0.78rem;
}
.cca-topbar-right a:hover { color: #FF9500; }

/* ---- TRICOLOR ACCENT ---- */
.cca-tricolor {
    display: flex;
    height: 4px;
    width: 100%;
}
.tc-saffron { flex: 1; background: #FF9933; }
.tc-white   { flex: 1; background: #FFFFFF; }
.tc-green   { flex: 1; background: #138808; }

/* ---- NAVBAR ---- */
.cca-navbar {
    background: #FFFFFF;
    box-shadow: 0 2px 20px rgba(10, 22, 40, 0.10);
    padding: 10px 0;
    transition: all 0.3s ease;
}
.cca-navbar.scrolled {
    padding: 6px 0;
    box-shadow: 0 4px 30px rgba(10, 22, 40, 0.18);
}

/* ---- LOGO ---- */
.cca-logo-wrap {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #0A1628;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    flex-shrink: 0;
    transition: transform 0.3s ease;
}
.cca-navbar.scrolled .cca-logo-wrap {
    width: 46px;
    height: 46px;
}
.cca-logo-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
}
.cca-brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
}
.cca-brand-main {
    font-size: 1.15rem;
    font-weight: 800;
    color: #0A1628;
    letter-spacing: 0.3px;
}
.cca-brand-sub {
    font-size: 0.72rem;
    font-weight: 500;
    color: #FF9500;
    letter-spacing: 0.2px;
}

/* ---- NAV LINKS ---- */
.cca-nav-link {
    font-size: 0.92rem;
    font-weight: 600;
    color: #2C3E50 !important;
    padding: 8px 14px !important;
    border-radius: 8px;
    position: relative;
    transition: color 0.2s ease, background 0.2s ease;
}
.cca-nav-link::after {
    content: '';
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 60%;
    height: 2px;
    background: #FF9500;
    border-radius: 2px;
    transition: transform 0.25s ease;
}
.cca-nav-link:hover,
.cca-nav-link.active {
    color: #FF9500 !important;
    background: rgba(255, 149, 0, 0.06);
}
.cca-nav-link:hover::after,
.cca-nav-link.active::after {
    transform: translateX(-50%) scaleX(1);
}

/* ---- CTA BUTTON ---- */
.cca-cta-btn {
    background: linear-gradient(135deg, #FF9500, #e67e00);
    color: #FFFFFF !important;
    font-weight: 700;
    font-size: 0.88rem;
    padding: 10px 22px;
    border-radius: 50px;
    text-decoration: none;
    white-space: nowrap;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 14px rgba(255, 149, 0, 0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    margin-left: 10px;
}
.cca-cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 149, 0, 0.45);
    color: #FFFFFF !important;
}

/* ---- HAMBURGER ---- */
.cca-toggler {
    border: none;
    background: none;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
}
.cca-toggler span {
    display: block;
    width: 24px;
    height: 2.5px;
    background: #0A1628;
    border-radius: 2px;
    transition: all 0.3s ease;
}
.cca-toggler:focus { box-shadow: none; outline: none; }

/* ---- MOBILE ---- */
@media (max-width: 991px) {
    .cca-brand-main { font-size: 0.95rem; }
    .cca-brand-sub  { font-size: 0.65rem; }
    .cca-logo-wrap  { width: 44px; height: 44px; }

    #ccaNavMenu {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(10,22,40,0.12);
        padding: 14px;
        margin-top: 10px;
    }
    .cca-nav-link { padding: 10px 12px !important; }
    .cca-cta-btn {
        margin: 10px 0 4px 0;
        display: inline-block;
        text-align: center;
    }
}
</style>

<!-- ===== SCROLL SHRINK SCRIPT ===== -->
<script>
(function(){
    const nav = document.getElementById('mainNav');
    window.addEventListener('scroll', function(){
        nav.classList.toggle('scrolled', window.scrollY > 60);
    });
})();
</script>
